[package]
name = "ironland-copositor"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "ironland-copositor"
path = "src/main.rs"

# A small standalone Wayland client, not part of the compositor binary
# itself: bridges the `ext-workspace-v1` global (see `src/ext_workspace.rs`)
# to line-delimited JSON on stdin/stdout, since Quickshell (what
# molunga-shell is built on) has no built-in support for that protocol.
# See its own module doc for the wire format.
[[bin]]
name = "ironland-workspaces"
path = "src/bin/ironland_workspaces.rs"

[dependencies]
bitflags = "2.2.1"
rand = "0.8"
tracing = { version = "0.1.37", features = ["max_level_trace", "release_max_level_debug"] }
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
thiserror = "1"
xcursor = "0.3.3"
xkbcommon = "0.8.0"
profiling = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.129"
toml = "1.1.5"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", default-features = false, features = ["staging", "client"] }
calloop = "0.14.4"
calloop-wayland-source = "0.4.1"
image = { version = "0.25.10", default-features = false, features = ["webp", "png", "jpeg"] }
wayland-protocols-wlr = { version = "0.3.12", default-features = false, features = ["server"] }
# Pinned to the exact versions smithay (see the `[dependencies.smithay]`
# git rev below) resolves to, so these are the same crate instances as
# `smithay::reexports::wayland_server`/`wayland_backend` - not a second,
# incompatible copy. Needed directly (rather than only transitively through
# smithay) to generate server bindings for Hyprland's own protocol
# extensions (`hyprland-focus-grab-v1`, `hyprland-global-shortcuts-v1`; see
# `src/hyprland_protocols.rs`), which aren't in the `wayland-protocols`/
# `wayland-protocols-wlr` crates.
wayland-server = "0.31.14"
wayland-backend = "0.3.17"
wayland-scanner = "0.31.11"

[dependencies.smithay]
git = "https://github.com/Smithay/smithay.git"
rev = "28c8e0fad905f3e7d01c2446fb60d26659071684"
default-features = false
features = [
  "desktop",
  "wayland_frontend",
  "use_system_lib",
  "backend_egl",
  "backend_winit",
  "backend_libinput",
  "backend_udev",
  "backend_drm",
  "backend_gbm",
  "backend_vulkan",
  "backend_session_libseat",
  "renderer_gl",
  "renderer_pixman",
  "renderer_multi",
]

[dependencies.smithay-drm-extras]
git = "https://github.com/Smithay/smithay.git"
rev = "28c8e0fad905f3e7d01c2446fb60d26659071684"

[features]
default = ["egl", "winit", "udev", "xwayland"]
egl = []
winit = []
udev = []
debug = []
x11 = []
xwayland = ["smithay/xwayland"]
libei = []
